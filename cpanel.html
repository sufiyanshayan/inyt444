});

// Drag & Drop events

});

dropZone.addEventListener('dragleave', function() {
    dropZone.classList.remove('dragover');
});

dropZone.addEventListener('drop', function(e) {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length > 0) {
        handleFile(e.dataTransfer.files[0]);
    }
});

// Remove image
removeBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    clearImage();
});

function handleFile(file) {
    if (!file.type.startsWith('image/')) {
        showStatus('❌ Please select an image file!', 'error');
        return;
    }
    if (file.size > 10 * 1024 * 1024) {
        showStatus('❌ Image size must be less than 10MB!', 'error');
        return;
    }
    const reader = new FileReader();
    reader.onload = function(e) {
        cropImageData = e.target.result;
        openCropModal(e.target.result);
    };
    reader.readAsDataURL(file);
}

// ===== CROP SYSTEM =====
const cropModal = document.getElementById('cropModal');
const cropImage = document.getElementById('cropImage');
const cropContainer = document.getElementById('cropContainer');
const cropRect = document.getElementById('cropRectangle');

let isDragging = false;
let isResizing = false;
let resizeDir = null;
let startX = 0,
    startY = 0;
let rect = { x: 10, y: 10, w: 80, h: 80 };
let containerWidth = 1,
    containerHeight = 1;

function openCropModal(imageSrc) {
    cropImage.src = imageSrc;
    currentRotation = 0;
    cropModal.classList.add('show');
    cropImage.style.transform = 'rotate(0deg)';
    cropRect.style.display = 'none';
    // Reset rect after image loads
    cropImage.onload = function() {
        const containerRect = cropContainer.getBoundingClientRect();
        containerWidth = containerRect.width;
        containerHeight = containerRect.height;
        rect = { x: 10, y: 10, w: 80, h: 80 };
        updateCropRect();
    };
    if (cropImage.complete) {
        cropImage.onload();
    }
}

function closeCropModal() {
    cropModal.classList.remove('show');
    cropImage.src = '';
    cropImageData = null;
    fileInput.value = '';
    cropRect.style.display = 'none';
}

function rotateImage() {
    currentRotation = (currentRotation + 90) % 360;
    cropImage.style.transform = 'rotate(' + currentRotation + 'deg)';
}

function updateCropRect() {
    const container = cropContainer.getBoundingClientRect();
    const imgRect = cropImage.getBoundingClientRect();
    const scaleX = imgRect.width / containerWidth;
    const scaleY = imgRect.height / containerHeight;
    const offsetX = (imgRect.left - container.left);
    const offsetY = (imgRect.top - container.top);

    cropRect.style.display = 'block';
    cropRect.style.left = (rect.x * scaleX + offsetX / container.width * 100) + '%';
    cropRect.style.top = (rect.y * scaleY + offsetY / container.height * 100) + '%';
    cropRect.style.width = (rect.w * scaleX) + '%';
    cropRect.style.height = (rect.h * scaleY) + '%';
}

// Mouse events for crop
cropContainer.addEventListener('mousedown', function(e) {
    var target = e.target;
    if (target.classList.contains('resize-handle')) {
        isResizing = true;
        resizeDir = target.dataset.dir;
        startX = e.clientX;
        startY = e.clientY;
        e.preventDefault();
        return;
    }
    if (target === cropContainer || target === cropImage || target === cropRect) {
        isDragging = true;
        var containerRect = cropContainer.getBoundingClientRect();
        startX = e.clientX - (containerRect.left + (rect.x / 100) * containerRect.width);
        startY = e.clientY - (containerRect.top + (rect.y / 100) * containerRect.height);
        e.preventDefault();
    }
});

document.addEventListener('mousemove', function(e) {
    if (!isDragging && !isResizing) return;
    var containerRect = cropContainer.getBoundingClientRect();
    var percentX = (e.clientX - containerRect.left) / containerRect.width * 100;
    var percentY = (e.clientY - containerRect.top) / containerRect.height * 100;

    if (isDragging) {
        rect.x = Math.max(0, Math.min(100 - rect.w, percentX - (rect.w * startX / (containerRect.width))));
        rect.y = Math.max(0, Math.min(100 - rect.h, percentY - (rect.h * startY / (containerRect.height))));
        updateCropRect();
    }
    if (isResizing) {
        var dx = (e.clientX - startX) / containerRect.width * 100;
        var dy = (e.clientY - startY) / containerRect.height * 100;
        var minSize = 5;
        var newX = rect.x,
            newY = rect.y,
            newW = rect.w,
            newH = rect.h;
        if (resizeDir.indexOf('e') !== -1) { newW = Math.max(minSize, rect.w + dx); }
        if (resizeDir.indexOf('w') !== -1) { newW = Math.max(minSize, rect.w - dx);
            newX = rect.x + rect.w - newW; }
        if (resizeDir.indexOf('s') !== -1) { newH = Math.max(minSize, rect.h + dy); }
        if (resizeDir.indexOf('n') !== -1) { newH = Math.max(minSize, rect.h - dy);
            newY = rect.y + rect.h - newH; }
        if (newX + newW > 100) { newW = 100 - newX; }
        if (newY + newH > 100) { newH = 100 - newY; }
        if (newW < minSize) { newW = minSize; }
        if (newH < minSize) { newH = minSize; }
        rect = { x: Math.max(0, newX), y: Math.max(0, newY), w: newW, h: newH };
        startX = e.clientX;
        startY = e.clientY;
        updateCropRect();
    }
});

document.addEventListener('mouseup', function() {
    isDragging = false;
    isResizing = false;
    resizeDir = null;
});

// Touch support
cropContainer.addEventListener('touchstart', function(e) {
    e.preventDefault();
    var touch = e.touches[0];
    var target = document.elementFromPoint(touch.clientX, touch.clientY);
    if (target && target.classList.contains('resize-handle')) {
        isResizing = true;
        resizeDir = target.dataset.dir;
        startX = touch.clientX;
        startY = touch.clientY;
        return;
    }
    isDragging = true;
    var containerRect = cropContainer.getBoundingClientRect();
    startX = touch.clientX - (containerRect.left + (rect.x / 100) * containerRect.width);
    startY = touch.clientY - (containerRect.top + (rect.y / 100) * containerRect.height);
}, { passive: false });

document.addEventListener('touchmove', function(e) {
    if (!isDragging && !isResizing) return;
    e.preventDefault();
    var touch = e.touches[0];
    var containerRect = cropContainer.getBoundingClientRect();
    var percentX = (touch.clientX - containerRect.left) / containerRect.width * 100;
    var percentY = (touch.clientY - containerRect.top) / containerRect.height * 100;

    if (isDragging) {
        rect.x = Math.max(0, Math.min(100 - rect.w, percentX - (rect.w * startX / (containerRect.width))));

    if (isResizing) {

        var dy = (touch.clientY - startY) / containerRect.height * 100;
        var minSize = 5;
        var newX = rect.x,
            newY = rect.y,
            newW = rect.w,
            newH = rect.h;
        if (resizeDir.indexOf('e') !== -1) { newW = Math.max(minSize, rect.w + dx); }
        if (resizeDir.indexOf('w') !== -1) { newW = Math.max(minSize, rect.w - dx);
            newX = rect.x + rect.w - newW; }
        if (resizeDir.indexOf('s') !== -1) { newH = Math.max(minSize, rect.h + dy); }
        if (resizeDir.indexOf('n') !== -1) { newH = Math.max(minSize, rect.h - dy);
            newY = rect.y + rect.h - newH; }
        if (newX + newW > 100) { newW = 100 - newX; }
        if (newY + newH > 100) { newH = 100 - newY; }
        if (newW < minSize) { newW = minSize; }
        if (newH < minSize) { newH = minSize; }
        rect = { x: Math.max(0, newX), y: Math.max(0, newY), w: newW, h: newH };
        startX = touch.clientX;
        startY = touch.clientY;
        updateCropRect();
    }
}, { passive: false });

document.addEventListener('touchend', function() {
    isDragging = false;
    isResizing = false;
    resizeDir = null;
});

function applyCrop() {
    var img = new Image();
    img.onload = function() {
        var canvas = document.createElement('canvas');
        var ctx = canvas.getContext('2d');
        var imgWidth = img.naturalWidth;
        var imgHeight = img.naturalHeight;
        var cropX = (rect.x / 100) * imgWidth;
        var cropY = (rect.y / 100) * imgHeight;
        var cropW = (rect.w / 100) * imgWidth;
        var cropH = (rect.h / 100) * imgHeight;

        if (currentRotation === 90 || currentRotation === 270) {
            canvas.width = cropH;
            canvas.height = cropW;
        } else {
            canvas.width = cropW;
            canvas.height = cropH;
        }
        ctx.save();
        if (currentRotation === 90) {
            ctx.translate(cropH, 0);
            ctx.rotate(Math.PI / 2);
            ctx.drawImage(img, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
        } else if (currentRotation === 180) {
            ctx.translate(cropW, cropH);
            ctx.rotate(Math.PI);
            ctx.drawImage(img, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
        } else if (currentRotation === 270) {
            ctx.translate(0, cropW);
            ctx.rotate(-Math.PI / 2);
            ctx.drawImage(img, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
        } else {
            ctx.drawImage(img, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
        }
        ctx.restore();
        var croppedDataUrl = canvas.toDataURL('image/jpeg', 0.9);
        uploadCroppedImage(croppedDataUrl);
    };
    img.src = cropImageData;
    closeCropModal();
}

function uploadCroppedImage(dataUrl) {
    isUploading = true;
    dropZone.classList.add('uploading');
    dropZone.classList.remove('has-image');
    uploadBar.style.width = '0%';
    var progress = 0;
    var interval = setInterval(function() {
        progress += 5;
        if (progress <= 90) {
            uploadBar.style.width = progress + '%';
        }
    }, 50);
    setTimeout(function() {
        uploadBar.style.width = '100%';
        setTimeout(function() {
            clearInterval(interval);
            dropZone.classList.remove('uploading');
            dropZone.classList.add('has-image');
            isUploading = false;
            previewImage.src = dataUrl;
            previewImage.style.display = 'block';
            fileName.textContent = 'Cropped Image';
            uploadedImageUrl = dataUrl;
            document.getElementById('profilePicUrl').textContent = 'cropped_image';
            showStatus('✅ Image cropped & uploaded successfully!', 'success');
        }, 300);
    }, 1000);
}

function validateEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

function validateLoginForm(email, pass) {
    var valid = true;
    var emailError = document.getElementById('emailError');
    var logEmail = document.getElementById('logEmail');
    if (!email || email.trim() === '') {
        emailError.textContent = '⚠️ Email address is required!';
        emailError.classList.add('show');
        logEmail.classList.add('error');
        valid = false;
    } else if (!validateEmail(email)) {
        emailError.textContent = '⚠️ Please enter a valid email address!';
        emailError.classList.add('show');
        logEmail.classList.add('error');
        valid = false;
    } else {
        emailError.classList.remove('show');
        logEmail.classList.remove('error');
    }
    var passError = document.getElementById('passError');
    var logPass = document.getElementById('logPass');
    if (!pass || pass.trim() === '') {
        passError.textContent = '⚠️ Password is required!';
        passError.classList.add('show');
        logPass.classList.add('error');
        valid = false;
    } else if (pass.length < 6) {
        passError.textContent = '⚠️ Password must be at least 6 characters!';
        passError.classList.add('show');
        logPass.classList.add('error');
        valid = false;
    } else {
        passError.classList.remove('show');
        logPass.classList.remove('error');
    }
    return valid;
}

function startInactivityTimer() {
    resetInactivityTimer();
    var lastActivity = Date.now();
    var updateActivity = function() { lastActivity = Date.now(); };
    var events = ['mousedown', 'mousemove', 'keypress', 'scroll', 'touchstart', 'click', 'input', 'focus'];
    events.forEach(function(evt) {
        document.addEventListener(evt, updateActivity);
    });
    activityCheckInterval = setInterval(function() {
        if ((Date.now() - lastActivity) / 1000 >= AUTO_LOGOUT_TIME) {
            clearInterval(activityCheckInterval);
            events.forEach(function(evt) {
                document.removeEventListener(evt, updateActivity);
            });
            autoLogout();
        }
    }, 1000);
}

function resetInactivityTimer() {
    if (activityCheckInterval) {
        clearInterval(activityCheckInterval);
        activityCheckInterval = null;
    }
}

function autoLogout() {
    resetInactivityTimer();
    var statusEl = document.getElementById('fStatus');
    if (statusEl && !document.getElementById('formCard').classList.contains('hidden')) {
        statusEl.innerText = '⏰ inactivity এর কারণে অটো লগআউট হয়েছে!';
        statusEl.className = "status status-warning";
    }
    setTimeout(function() { handleLogout(); }, 2000);
}

function startTabChangeDetection() {
    document.addEventListener('visibilitychange', handleVisibilityChange);
}

function stopTabChangeDetection() {
    document.removeEventListener('visibilitychange', handleVisibilityChange);
    if (tabChangeTimer) {
        clearTimeout(tabChangeTimer);
        tabChangeTimer = null;
    }
    tabHiddenTime = null;
}

function handleVisibilityChange() {
    if (document.hidden) {
        tabHiddenTime = Date.now();
        tabChangeTimer = setTimeout(function() { tabChangeLogout(); }, TAB_CHANGE_LOGOUT_TIME * 1000);
    } else {
        if (tabHiddenTime) {
            var elapsed = (Date.now() - tabHiddenTime) / 1000;
            if (elapsed >= TAB_CHANGE_LOGOUT_TIME) {
                return;
            } else {
                if (tabChangeTimer) {
                    clearTimeout(tabChangeTimer);
                    tabChangeTimer = null;
                }
                tabHiddenTime = null;
            }
        }
    }
}

function tabChangeLogout() {
    stopTabChangeDetection();
    var statusEl = document.getElementById('fStatus');
    if (statusEl && !document.getElementById('formCard').classList.contains('hidden')) {
        statusEl.innerText = '⏰ 1 মিনিট অন্য ট্যাবে থাকার কারণে অটো লগআউট হয়েছে!';
        statusEl.className = "status status-warning";
    }
    setTimeout(function() { handleLogout(); }, 2000);
}

async function handleLogin() {
    var email = document.getElementById('logEmail').value.trim();
    var pass = document.getElementById('logPass').value;
    var statusEl = document.getElementById('logStatus');
    var btn = document.getElementById('logBtn');

    if (!validateLoginForm(email, pass)) {
        statusEl.innerText = "❌ Please fill in all required fields correctly!";
        statusEl.className = "status status-error";
        return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Checking...';
    statusEl.className = "status";
    statusEl.innerText = "";

    try {
        var result = await sb.auth.signInWithPassword({ email: email, password: pass });
        var data = result.data;
        var error = result.error;

        if (error) {
            var msg = error.message;
            if (error.message.includes('Invalid login credentials')) {
                msg = '❌ Incorrect email or password!';
            } else if (error.message.includes('Email not confirmed')) {
                msg = '❌ Email not verified. Please check your inbox!';
            } else if (error.message.includes('rate limit')) {
                msg = '⚠️ Too many attempts. Please try again later!';
            }
            statusEl.innerText = msg;
            statusEl.className = "status status-error";
            btn.disabled = false;
            btn.innerHTML = 'LOGIN';
            return;
        }

        if (!data || !data.user) {
            statusEl.innerText = "❌ Login failed! Please try again.";
            statusEl.className = "status status-error";
            btn.disabled = false;
            btn.innerHTML = 'LOGIN';
            return;
        }

        var tableName = getUserTableName(data.user.email);
        if (!tableName) {
            statusEl.innerHTML = "THIS USER IS CURRENTLY UNDER CONSTRUCTION,<br>PLEASE TRY AGAIN LATER AND<br>CONTACT THE ADMIN.";
            statusEl.className = "status status-warning";
            await sb.auth.signOut();
            btn.disabled = false;
            btn.innerHTML = 'LOGIN';
            return;
        }

        CURRENT_USER_TABLE = tableName;
        CURRENT_USER_EMAIL = data.user.email;
        statusEl.className = "status";
        statusEl.innerText = "";

        document.getElementById('loginCard').classList.add('hidden');
        document.getElementById('formCard').classList.remove('hidden');
        document.getElementById('displayEmail').textContent = CURRENT_USER_EMAIL;
        document.getElementById('logEmail').value = '';
        document.getElementById('logPass').value = '';
        document.getElementById('emailError').classList.remove('show');
        document.getElementById('passError').classList.remove('show');
        document.getElementById('logEmail').classList.remove('error');
        document.getElementById('logPass').classList.remove('error');

        startInactivityTimer();
        startTabChangeDetection();
        await loadExistingData();

    } catch (err) {
        console.error('Login error:', err);
        statusEl.innerText = "❌ Network error! Please check your connection.";
        statusEl.className = "status status-error";
        btn.disabled = false;
        btn.innerHTML = 'LOGIN';
    }
}

async function loadExistingData() {
    try {
        var result = await sb.from(CURRENT_USER_TABLE).select('*').order('created_at', { ascending: false }).limit(1).maybeSingle();
        var data = result.data;
        var error = result.error;
        if (error) {
            console.error('Data load error:', error);
            return;
        }
        if (data) {
            document.getElementById('f1').value = data.website_title || '';
            if (data.profile_pic) {
                setImageFromUrl(data.profile_pic);
            }
            document.getElementById('f3').value = data.name || '';
            document.getElementById('f4').value = data.title || '';
            document.getElementById('f5').value = extractUsername(data.facebook, 'facebook.com/');
            document.getElementById('f6').value = extractUsername(data.fb_page, 'facebook.com/');
            document.getElementById('f7').value = extractUsername(data.instagram, 'instagram.com/');
            document.getElementById('f9').value = extractUsername(data.tiktok, 'tiktok.com/@');
            document.getElementById('f10').value = extractUsername(data.telegram, 't.me/');
            document.getElementById('f11').value = extractUsername(data.twitter, 'x.com/');
            document.getElementById('f8').value = extractWhatsApp(data.whatsapp);
            document.getElementById('f12').value = data.phone || '';
            document.getElementById('f13').value = data.about || '';
            document.getElementById('f14').value = data.website || '';
            document.getElementById('f15').value = data.copyright_line || '';
            document.getElementById('f16').value = data.made_by || '';
            document.getElementById('f17').value = data.all_rights || '';
            updatePageFavicon(data.favicon);
        }
    } catch (err) {
        console.error('Error loading data:', err);
    }
}

function extractUsername(url, domain) {
    if (!url) return '';
    if (url.includes(domain)) {
        return url.split(domain)[1].replace(/\/$/, '');
    }
    return url;
}

function extractWhatsApp(url) {
    if (!url) return '';
    var match = url.match(/wa\.me\/(\+?\d+)/);
    return match ? match[1] : url;
}

function updatePageFavicon(url) {
    var favicon = document.getElementById('dynamicFavicon');
    if (url && url.trim() !== '') {
        favicon.href = url;
    } else {
        favicon.href = 'YOUR_FAVICON_LINK';
    }
}

async function updateData() {
    var btn = document.getElementById('upBtn');
    var statusEl = document.getElementById('fStatus');
    var whatsappVal = document.getElementById('f8').value.trim();
    var fbVal = document.getElementById('f5').value.trim();
    var fbPageVal = document.getElementById('f6').value.trim();
    var instaVal = document.getElementById('f7').value.trim();
    var tiktokVal = document.getElementById('f9').value.trim();
    var telegramVal = document.getElementById('f10').value.trim();
    var twitterVal = document.getElementById('f11').value.trim();

    var profilePicValue = '';
    if (uploadedImageUrl) {
        profilePicValue = uploadedImageUrl;
    }

    var updateDataObj = {
        website_title: document.getElementById('f1').value.trim(),
        profile_pic: profilePicValue,
        name: document.getElementById('f3').value.trim(),
        title: document.getElementById('f4').value.trim(),
        facebook: fbVal ? 'https://www.facebook.com/' + fbVal : '',
        fb_page: fbPageVal ? 'https://www.facebook.com/' + fbPageVal : '',
        instagram: instaVal ? 'https://www.instagram.com/' + instaVal : '',
        whatsapp: whatsappVal ? 'https://wa.me/' + whatsappVal.replace(/\D/g, '') : '',
        tiktok: tiktokVal ? 'https://www.tiktok.com/@' + tiktokVal : '',
        telegram: telegramVal ? 'https://t.me/' + telegramVal : '',
        twitter: twitterVal ? 'https://x.com/' + twitterVal : '',
        phone: document.getElementById('f12').value.trim(),
        about: document.getElementById('f13').value.trim(),
        website: document.getElementById('f14').value.trim(),
        copyright_line: document.getElementById('f15').value.trim(),
        made_by: document.getElementById('f16').value.trim(),
        all_rights: document.getElementById('f17').value.trim()
    };

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';

    try {
        var selectResult = await sb.from(CURRENT_USER_TABLE).select('id').order('created_at', { ascending: false }).limit(1).maybeSingle();
        var existingData = selectResult.data;
        var selectError = selectResult.error;
        if (selectError) throw selectError;

        var updateResult;
        if (existingData && existingData.id) {
            updateResult = await sb.from(CURRENT_USER_TABLE).update(updateDataObj).eq('id', existingData.id);
        } else {
            updateResult = await sb.from(CURRENT_USER_TABLE).insert([updateDataObj]);
        }
        if (updateResult.error) throw updateResult.error;

        statusEl.innerText = "✅ Success: Data Updated Successfully!";
        statusEl.className = "status status-success";
        setTimeout(function() {
            statusEl.className = "status";
            statusEl.innerText = "";
        }, 4000);
    } catch (err) {
        console.error('Update error:', err);
        statusEl.innerText = "❌ Error: " + (err.message || 'Something went wrong');
        statusEl.className = "status status-error";
    } finally {
        btn.disabled = false;
        btn.innerHTML = 'UPDATE';
    }
}

async function handleLogout() {
    resetInactivityTimer();
    stopTabChangeDetection();
    await sb.auth.signOut();
    CURRENT_USER_TABLE = null;
    CURRENT_USER_EMAIL = null;
    document.getElementById('formCard').classList.add('hidden');

    document.getElementById('logEmail').value = '';
    document.getElementById('logPass').value = '';
    document.getElementById('logStatus').className = 'status';
    document.getElementById('logStatus').innerText = '';
    document.getElementById('emailError').classList.remove('show');

    document.getElementById('logPass').classList.remove('error');

        statusEl.className = 'status';
        statusEl.innerText = '';

    updatePageFavicon('');
}
