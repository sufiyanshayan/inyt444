<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INYT 444 • Page Not Found</title>

<!-- Favicon -->
<link rel="icon" type="image/png" href="https://i.postimg.cc/7ZsCGC17/451236214-995219779013572-5086974055196939289-n-(1).jpg">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fafafa;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #000000;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: absolute;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(0,0,0,0.03) 0%, transparent 70%);
    top: -120px;
    left: -120px;
    border-radius: 50%;
  }

  body::after {
    content: '';
    position: absolute;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(0,0,0,0.03) 0%, transparent 70%);
    bottom: -150px;
    right: -100px;
    border-radius: 50%;
  }

  .card {
    position: relative;
    text-align: center;
    max-width: 480px;
    z-index: 1;
    background: #ffffff;
    padding: 56px 40px;
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.08);
    border: 1px solid #f0f0f0;
  }

  /* Logo placeholder - replace src with your logo link */
  .logo {
    width: 72px;
    height: 72px;
    object-fit: cover;
    border-radius: 50%;
    margin-bottom: 18px;
  }

  .number {
    font-size: clamp(70px, 18vw, 120px);
    font-weight: 800;
    line-height: 1;
    color: #000000;
    letter-spacing: 4px;
    margin-bottom: 8px;
  }

  h1 {
    font-size: clamp(20px, 5vw, 26px);
    font-weight: 700;
    margin-bottom: 12px;
    color: #000000;
  }

  p {
    font-size: 15px;
    color: #000000;
    line-height: 1.7;
    margin-bottom: 30px;
  }

  .btn {
    display: inline-block;
    padding: 12px 30px;
    background: #000000;
    color: #ffffff;
    font-weight: 600;
    font-size: 15px;
    text-decoration: none;
    border-radius: 999px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 8px 22px rgba(0,0,0,0.18);
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(0,0,0,0.28);
  }
</style>
</head>
<body>
  <div class="card">
    <!-- Replace "Your_Logo_Link" with your logo image URL -->
    <img class="logo" src="https://i.postimg.cc/7ZsCGC17/451236214-995219779013572-5086974055196939289-n-(1).jpg" alt="Logo">
    <div class="number">SORRY</div>
    <h1>This page doesn't exist right now</h1>
    <p>The page you're looking for may have been moved, renamed, or is temporarily unavailable.</p>
    <a href="/" class="btn">Back to Homepage</a>
  </div>
</body>
</html>
